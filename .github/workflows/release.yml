name: release

# On a pushed v* tag: build the distributable tarball, publish it as a GitHub
# release asset, and attest its provenance.
#
# The release asset is what `mise` installs — the github backend downloads
# release *assets* and ignores GitHub's auto-generated source tarballs, so this
# workflow (not the tag alone) is what makes a version installable.
#
# Asset naming matters and is load-bearing:
#   git-toolbelt-<version>.tar.gz         picked by mise's asset autodetection
#   git-toolbelt-<version>.tar.gz.sha256  exact-matched by mise and verified
# See docs/maintaining-the-fork.md for why those names work with zero tool
# options on the user's side.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reject a version the ecosystem mis-parses
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          # The fork owns its own semver line (see PUBLISHING.md). Pre-release
          # suffixes sort as prereleases in mise and are excluded from `latest`,
          # so a plain X.Y.Z tag is required.
          if ! printf '%s' "$version" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::tag '$GITHUB_REF_NAME' is not vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi

      - name: Build the release tarball
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          scripts/build-dist.sh "$version" dist
          cd dist
          sha256sum "git-toolbelt-$version.tar.gz" \
            > "git-toolbelt-$version.tar.gz.sha256"
          ls -l

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.tar.gz

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag --generate-notes \
            dist/*.tar.gz dist/*.tar.gz.sha256
