name: ci

# Each job runs one mise task, so a failure names itself in the checks list
# rather than hiding inside a single combined run. The task definitions live in
# mise.toml and are what `mise run ci` runs locally, so CI and local can't drift.
#
# Job names are load-bearing: branch protection on main requires the status
# check named `shellcheck`. Renaming that job silently blocks every future PR —
# including the release PR that release-please opens — because a required check
# that never reports is never satisfied. Update the branch protection rule first
# if these names ever change.

on:
  push:
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - run: mise run lint:sh

  yamllint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - run: mise run lint:yaml

  # Builds the release tarball and exercises it the way an install does, so a
  # broken archive is caught here rather than at release time.
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - run: mise run smoke
