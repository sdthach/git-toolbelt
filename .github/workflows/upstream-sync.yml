name: upstream-sync

# Pull fixes/features from upstream nvie/git-toolbelt into this fork's main by
# opening a PR (never an auto fast-forward — fork-only files like docs/ and the
# README hub diverge from upstream and a merge may need a human to resolve).
#
# main requires linear history and signed commits, and upstream's commits are
# mostly unsigned, so a sync always lands as one squash commit. That means
# upstream's commits never become ancestors of main, and
# `git rev-list origin/main..upstream/main` would count the same commits
# forever. Instead, .upstream-sync-base records the upstream commit the last
# sync brought in, and only upstream commits after it count.

on:
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Open a sync PR from upstream/main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # This repo is a fork, and gh resolves a fork's base repo to its
          # PARENT — without this, `gh pr create` below targets
          # nvie/git-toolbelt instead of us and fails.
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/nvie/git-toolbelt.git
          git fetch --quiet upstream main
          tip="$(git rev-parse upstream/main)"

          # The upstream commit the last sync brought in. Fall back to the
          # merge base if the file is missing or names an unknown commit.
          base="$(sed -n '1p' .upstream-sync-base 2>/dev/null || true)"
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base="$(git merge-base origin/main upstream/main)"
            echo "No usable .upstream-sync-base; counting from the merge base $base."
          fi

          ahead="$(git rev-list --count "$base..upstream/main")"
          if [ "$ahead" -eq 0 ]; then
            echo "main already has upstream up to ${tip}; nothing to sync."
            exit 0
          fi
          echo "upstream has $ahead commit(s) after $base."

          # One sync at a time: an open sync PR, or an open issue asking for a
          # manual sync, already covers these commits (or an older subset).
          open="$(gh pr list --state open --json headRefName \
            --jq '[.[] | select(.headRefName | startswith("upstream-sync/"))] | length')"
          issues="$(gh issue list --state open --search 'in:title "upstream sync:"' \
            --json title --jq '[.[] | select(.title | startswith("upstream sync:"))] | length')"
          if [ "$open" -gt 0 ] || [ "$issues" -gt 0 ]; then
            echo "A sync PR or manual-sync issue is already open; not opening another."
            exit 0
          fi

          # Named after the upstream tip, so the same tip never opens two PRs.
          branch="upstream-sync/${tip:0:12}"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            echo "Branch $branch already exists on origin; not opening another PR."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --quiet -c "$branch" origin/main

          title="feat: sync upstream nvie/git-toolbelt to ${tip:0:7} ($ahead commit(s))"
          # Apply only upstream's commits since the last sync. A plain
          # `git merge --squash upstream/main` would replay everything since
          # the fork point (squashed syncs never make upstream an ancestor of
          # main) and report conflicts on changes an earlier sync brought in.
          # README.md is the fork's own index: upstream's README changes are
          # ported into docs/commands.md by hand, so they are left out of the
          # patch and flagged in the PR instead of causing a conflict.
          readme="$(git diff --stat "$base" upstream/main -- README.md)"
          if git diff --binary "$base" upstream/main -- . ':(exclude)README.md' \
              | git apply --3way --index >/dev/null 2>&1; then
            # Clean: commit the sync together with the new base.
            printf '%s\n' "$tip" > .upstream-sync-base
            git add .upstream-sync-base
            git commit --quiet -m "$title"
            git push --quiet origin "$branch"
            body="Automated weekly sync: upstream's commits since \`$base\` applied onto main,"
            body="$body plus \`.upstream-sync-base\` set to \`$tip\`."
            body="$body\n\n**Squash-merge this PR** so release-please sees one classified subject."
            body="$body Retitle to \`fix:\` if the sync is fixes only, or \`feat!:\` if upstream"
            body="$body removed or renamed commands."
            if [ -n "$readme" ]; then
              body="$body\n\n**upstream changed README.md**, which this PR leaves out. Port the"
              body="$body change into docs/commands.md: \`git diff $base $tip -- README.md\`"
            fi
            gh pr create --base main --head "$branch" \
              --title "$title" \
              --body "$(printf '%b' "$body")"
          else
            # Conflicts with the fork: nothing to push. Open one issue that
            # lists the commits and the conflicting files; the sync is done
            # by hand (docs/maintaining-the-fork.md#syncing-from-upstream).
            conflicts="$(git diff --name-only --diff-filter=U | sed 's/^/- `/; s/$/`/')"
            git reset --quiet --hard origin/main
            commits="$(git log --format='- %h %s' "$base..upstream/main")"
            body="upstream has $ahead commit(s) since \`$base\` that don't apply cleanly to main."
            body="$body\n\nConflicting files:\n${conflicts:-- (see a local run)}"
            body="$body\n\nCommits:\n$commits"
            body="$body\n\nSync by hand: docs/maintaining-the-fork.md#syncing-from-upstream."
            body="$body Close this issue when the sync PR merges."
            gh issue create --title "upstream sync: ${tip:0:7} needs a manual sync ($ahead commit(s))" \
              --body "$(printf '%b' "$body")"
          fi
